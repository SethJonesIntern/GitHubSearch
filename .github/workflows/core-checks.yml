name: Core checks

on:
  push:
    branches: [main]
  pull_request:
    branches: [main]
  workflow_dispatch:

permissions:
  contents: read

jobs:
  core-tests:
    name: Core tests (${{ matrix.os }})
    strategy:
      fail-fast: false
      matrix:
        os: [ubuntu-latest, windows-latest]
    runs-on: ${{ matrix.os }}
    env:
      GIT_LFS_SKIP_SMUDGE: "1"
    steps:
      - uses: actions/checkout@v4
        with:
          lfs: false
          persist-credentials: false
      - uses: actions/setup-python@v5
        with:
          python-version: "3.14"
      - name: Install test runner
        run: python -m pip install -r requirements/ci.txt
      - name: Test method counts, slice filters, and evaluation frequency
        run: python -m pytest pipeline/test_method_test_baseline.py pipeline/test_slice_repo_filter.py pipeline/test_eval_frequency.py Applications/test_guardrail_figures.py -q

