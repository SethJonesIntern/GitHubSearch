  <g id="text_1">
   <text style="font-weight: 700; font-size: 17px; font-family: 'DejaVu Sans'; text-anchor: start; fill: #172b46" x="55.224" y="36.677344" transform="rotate(-0 55.224 36.677344)">Proposed dimensions for characterizing correctness checks</text>
  </g>
  <g id="text_2">
   <text style="font-size: 10px; font-family: 'DejaVu Sans'; text-anchor: start; fill: #586779" x="55.224" y="64.622437" transform="rotate(-0 55.224 64.622437)">Candidate coding scheme for manual inspection, not a validated taxonomy or observed distribution</text>
  </g>
  <g id="text_3">
   <text style="font-weight: 700; font-size: 14px; font-family: 'DejaVu Sans'; text-anchor: start; fill: #2864b7" x="55.224" y="138.941813" transform="rotate(-0 55.224 138.941813)">When</text>
  </g>
  <g id="text_4">
   <text style="font-size: 11px; font-family: 'DejaVu Sans'; fill: #172b46" transform="translate(186.912 140.929938)">Test suite</text>
   <text style="font-size: 11px; font-family: 'DejaVu Sans'; fill: #172b46" transform="translate(186.912 157.979938)">Runtime</text>
  </g>
  <g id="text_5">
   <text style="font-size: 10px; font-family: 'DejaVu Sans'; fill: #586779" transform="translate(552.24 139.782125)">Runtime checks must intervene before</text>
   <text style="font-size: 10px; font-family: 'DejaVu Sans'; fill: #586779" transform="translate(552.24 154.313375)">acceptance or action to count as guardrails.</text>
  </g>
  <g id="text_6">
   <text style="font-weight: 700; font-size: 14px; font-family: 'DejaVu Sans'; text-anchor: start; fill: #2864b7" x="55.224" y="217.349813" transform="rotate(-0 55.224 217.349813)">What</text>
  </g>
  <g id="text_7">
   <text style="font-size: 11px; font-family: 'DejaVu Sans'; fill: #172b46" transform="translate(186.912 218.272313)">Availability / structure / expected content</text>
   <text style="font-size: 11px; font-family: 'DejaVu Sans'; fill: #172b46" transform="translate(186.912 235.955672)">Behavioral constraints / semantic correctness</text>
  </g>
  <g id="text_8">
   <text style="font-size: 10px; font-family: 'DejaVu Sans'; fill: #586779" transform="translate(552.24 217.221375)">The property checked determines</text>
   <text style="font-size: 10px; font-family: 'DejaVu Sans'; fill: #586779" transform="translate(552.24 232.721375)">the claim the check can support.</text>
  </g>
  <g id="text_9">
   <text style="font-weight: 700; font-size: 14px; font-family: 'DejaVu Sans'; text-anchor: start; fill: #2864b7" x="55.224" y="295.756719" transform="rotate(-0 55.224 295.756719)">How</text>
  </g>
  <g id="text_10">
   <text style="font-size: 11px; font-family: 'DejaVu Sans'; fill: #172b46" transform="translate(186.912 297.745937)">Deterministic rules or assertions</text>
   <text style="font-size: 11px; font-family: 'DejaVu Sans'; fill: #172b46" transform="translate(186.912 313.730312)">Metrics / model-based judgments</text>
  </g>
  <g id="text_11">
   <text style="font-size: 10px; font-family: 'DejaVu Sans'; fill: #586779" transform="translate(552.24 295.629375)">An assert can enforce a judge-score threshold.</text>
   <text style="font-size: 10px; font-family: 'DejaVu Sans'; fill: #586779" transform="translate(552.24 311.129375)">Library use does not determine check complexity.</text>
  </g>
  <g id="text_12">
   <text style="font-weight: 700; font-size: 14px; font-family: 'DejaVu Sans'; text-anchor: start; fill: #2864b7" x="55.224" y="374.164719" transform="rotate(-0 55.224 374.164719)">Response</text>
  </g>
  <g id="text_13">
   <text style="font-size: 11px; font-family: 'DejaVu Sans'; fill: #172b46" transform="translate(186.912 375.088313)">Fail test / reject / retry / correct</text>
   <text style="font-size: 11px; font-family: 'DejaVu Sans'; fill: #172b46" transform="translate(186.912 393.203937)">Escalate for review</text>
  </g>
  <g id="text_14">
   <text style="font-size: 10px; font-family: 'DejaVu Sans'; fill: #586779" transform="translate(552.24 375.006125)">Record the action on failure.</text>
   <text style="font-size: 10px; font-family: 'DejaVu Sans'; fill: #586779" transform="translate(552.24 389.537375)">Logging alone establishes observation.</text>
  </g>
  <g id="text_15">
   <text style="font-size: 9px; font-family: 'DejaVu Sans'; text-anchor: start; fill: #586779" x="55.224" y="453.816" transform="rotate(-0 55.224 453.816)">Dimensions can overlap. Validate definitions and coding reliability before reporting category frequencies.</text>
  </g>
 </g>
